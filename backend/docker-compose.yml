services:
  backend:
    image: ghcr.io/joakoali/gestion-cadetes-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - gec

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - backend
    networks:
      - gec

networks:
  gec:
